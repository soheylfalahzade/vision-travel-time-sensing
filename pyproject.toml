[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-travel-time-sensing"
version = "0.1.0"
description = "Edge travel-time estimation from sparse multi-camera vehicle re-identification, with graph gating, network tomography and spanner sensitivity analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "soheylfalahzade" }]
keywords = ["intelligent-transportation-systems", "vehicle-re-identification", "travel-time-estimation", "network-tomography", "geometric-spanners"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
sumo = ["eclipse-sumo", "traci"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
vtts-eval = "vtts.evaluate:main"
vtts-simulate = "vtts.simulate:main"
vtts-gif = "vtts.viz:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vtts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
